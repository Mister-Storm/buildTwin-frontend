name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and component tests
        run: npm test

  coverage:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Coverage
        run: npx vitest run --coverage

  build:
    runs-on: ubuntu-latest
    needs: coverage
    env:
      BUILDTWIN_API_URL: http://localhost:8080
      BUILDTWIN_DEMO_MODE: true
      NEXT_PUBLIC_BUILDTWIN_DEMO_MODE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      CI: true
      BUILDTWIN_API_URL: http://localhost:8080
      BUILDTWIN_DEMO_MODE: true
      NEXT_PUBLIC_BUILDTWIN_DEMO_MODE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: BUILDTWIN_DEMO_MODE=true npm run test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  authorization:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PILOT_BACKEND_REVISION: ${{ vars.PILOT_BACKEND_REVISION }}
    steps:
      - name: Require pinned producer revision and private checkout access
        env:
          PILOT_BACKEND_READ_TOKEN: ${{ secrets.PILOT_BACKEND_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ.get('PILOT_BACKEND_REVISION', '')), 'Set PILOT_BACKEND_REVISION to the exact reviewed backend commit'
          assert os.environ.get('PILOT_BACKEND_READ_TOKEN'), 'Set PILOT_BACKEND_READ_TOKEN with contents-read access to the private backend repository'
          PY
      - uses: actions/checkout@v4
        with:
          path: buildTwin-frontend
      - uses: actions/checkout@v4
        with:
          repository: mister-storm/buildtwin
          token: ${{ secrets.PILOT_BACKEND_READ_TOKEN }}
          persist-credentials: false
          ref: ${{ env.PILOT_BACKEND_REVISION }}
          path: buildtwin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: buildTwin-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: buildTwin-frontend
        run: npm ci
      - name: Producer-consumer contracts and real auth browser
        working-directory: buildtwin
        run: python3 scripts/pilot-authorization-ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorization-${{ github.sha }}
          path: buildtwin/.gradle/pilot-validation/authorization-ci/*.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
