name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and component tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-junit.xml
      - name: Reject missing required contract suites
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as E
          suites = {s.get('name'): s for s in E.parse('test-results/vitest-junit.xml').getroot().iter('testsuite')}
          required = [
              'src/services/artifact-contract.test.ts',
              'src/services/auth-contract.test.ts',
              'src/services/scope-contract.test.ts',
              'src/services/capabilities.service.test.ts',
              'src/services/api-client.test.ts',
              'src/features/built-area/DetectBuiltAreaButton.test.tsx',
          ]
          for name in required:
              suite = suites.get(name)
              assert suite is not None and int(suite.get('tests', '0')) > 0, 'Missing required suite: ' + name
              assert not any(int(suite.get(field) or 0) for field in ['failures', 'errors', 'skipped']), 'Required suite failed: ' + name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-${{ github.sha }}
          path: test-results/vitest-junit.xml
          if-no-files-found: error
          retention-days: 14

  coverage:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Coverage
        run: npx vitest run --coverage

  build:
    runs-on: ubuntu-latest
    needs: coverage
    env:
      BUILDTWIN_API_URL: http://localhost:8080
      BUILDTWIN_DEMO_MODE: true
      NEXT_PUBLIC_BUILDTWIN_DEMO_MODE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      CI: true
      BUILDTWIN_API_URL: http://localhost:8080
      BUILDTWIN_DEMO_MODE: true
      NEXT_PUBLIC_BUILDTWIN_DEMO_MODE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: BUILDTWIN_DEMO_MODE=true npm run test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
